name: Opensourceware DAO manifest review
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'startabusiness/**'
      - '.github/workflows/startabusiness-review.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sandbox manifests
        run: node startabusiness/scripts/validate.mjs
      - name: Preserve verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: opensourceware-validation-receipt
          path: startabusiness/witness/validation-receipt.json
